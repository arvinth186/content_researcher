[project]
name = "content_researcher"
version = "0.1.0"
description = "content_researcher using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai-tools>=1.14.3",
    "crewai[litellm,tools]>=0.102.0",
    "fastapi>=0.136.3",
    "pydantic>=2.11.10",
    "python-dotenv>=1.2.2",
    "streamlit>=1.58.0",
    "uvicorn>=0.49.0",
]

[project.scripts]
content_researcher = "content_researcher.main:run"
run_crew = "content_researcher.main:run"
train = "content_researcher.main:train"
replay = "content_researcher.main:replay"
test = "content_researcher.main:test"
run_with_trigger = "content_researcher.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
